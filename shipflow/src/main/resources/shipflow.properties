# Connection settings for the two databases Shipflow copies orders between.
#
# This file is a template. Do not put real values in it, because this
# repository is public and the values stay in the git history.
#
# To supply the values, copy this file to "shipflow.properties" in the
# directory you start Shipflow from and fill in your own values there, or pass
# them to the JVM as system properties, for example
# -Ddb.shipworks.password=secret. A file named shipflow.properties in the
# working directory replaces the values of this template.

db.shipworks.driverClassName=net.sourceforge.jtds.jdbc.Driver
db.shipworks.url=
db.shipworks.username=
db.shipworks.password=

db.inflow.driverClassName=net.sourceforge.jtds.jdbc.Driver
db.inflow.url=
db.inflow.username=
db.inflow.password=
